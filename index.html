<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bio Link Hub</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="card">
    <header class="profile-header">
      <div class="avatar-wrapper">
        <img id="avatar" src="assets/avatar.png" alt="Profile Picture">
      </div>
      <h1 id="name">Loading...</h1>
      <p id="handle" class="handle"></p>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="status">...</span>
      </div>
    </header>

    <p id="bio" class="bio-text"></p>

    <div id="socials" class="social-bar"></div>

    <main id="links-container" class="links-list"></main>

    <footer>
      <p>Made with fun ✨ Powered by GitHub Pages</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
