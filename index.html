<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubist's Space</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Retro Floating Audio Widget -->
  <div class="audio-controls">
    <button id="music-btn" class="audio-btn" title="Toggle Background Music">
      <span class="audio-icon">🎵</span>
      <span id="music-status">OFF</span>
    </button>
  </div>

  <div class="card">
    <header class="profile-header">
      <div class="avatar-wrapper">
        <img id="avatar" src="assets/avatar.png" alt="Profile Picture">
      </div>
      <h1 id="name">Loading...</h1>
      <p id="handle" class="handle"></p>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="status">...</span>
      </div>
    </header>

    <p id="bio" class="bio-text"></p>

    <!-- Single Unified Links Container -->
    <main id="links-container" class="links-list"></main>

    <footer>
      <p>Made with fun ✨ Cubist © 2017-Present</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
